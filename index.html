<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba: video, animación y foto 360</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<style>
  :root {
    --fondo: #0b1020;
    --texto: #eef2ff;
    --suave: #a9b4d6;
    --acento: #5eead4;
    --acento2: #f472b6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--fondo);
    color: var(--texto);
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
  }
  #fondo { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  main {
    position: relative;
    z-index: 1;
    max-width: 820px;
    margin: 0 auto;
    padding: 4rem 1.5rem 5rem;
    text-align: center;
  }
  h1 {
    font-size: clamp(2.2rem, 7vw, 3.8rem);
    line-height: 1.1;
    margin: 0 0 1rem;
    background: linear-gradient(90deg, var(--acento), var(--acento2), var(--acento));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: brillo 6s linear infinite;
  }
  @keyframes brillo { to { background-position: 200% center; } }
  h2 { font-size: 1.5rem; margin: 3.5rem 0 .5rem; }
  p { color: var(--suave); max-width: 54ch; margin: 0 auto 1.5rem; }
  .marco {
    border-radius: 14px;
    padding: 6px;
    background: linear-gradient(135deg, var(--acento), var(--acento2));
    box-shadow: 0 20px 60px rgba(94, 234, 212, .18);
  }
  .marco iframe {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    height: auto;
    border: 0;
    border-radius: 9px;
    background: #000;
  }
  main.arriba { padding-bottom: 1rem; }
  .pano-full {
    position: relative;
    z-index: 1;
    width: 100%;
    margin: 1.5rem 0 4rem;
    border-style: solid;
    border-width: 4px 0;
    border-image: linear-gradient(90deg, var(--acento), var(--acento2)) 1;
  }
  #panorama {
    width: 100%;
    height: 70vh;
    min-height: 420px;
    background: #000;
    text-align: left;
  }
  #cursor {
    position: fixed;
    top: 0; left: 0;
    width: 28px; height: 28px;
    margin: -14px 0 0 -14px;
    border: 2px solid var(--acento);
    border-radius: 50%;
    pointer-events: none;
    z-index: 5;
    mix-blend-mode: screen;
    transition: width .2s, height .2s, margin .2s, background .2s;
  }
  #cursor.grande { width: 56px; height: 56px; margin: -28px 0 0 -28px; background: rgba(94, 234, 212, .15); }
  @media (hover: none) { #cursor { display: none; } }
  

  /* ===== Punto interactivo: Estadio Nacional ===== */
  .punto-estadio {
    width: 30px; height: 30px;
    cursor: pointer;
  }
  .punto-estadio .centro {
    position: absolute; inset: 9px;
    border-radius: 50%;
    background: var(--acento);
    box-shadow: 0 0 0 3px rgba(11, 16, 32, .65);
  }
  .punto-estadio .pulso {
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 2px solid var(--acento2);
    animation: pulso 2s ease-out infinite;
  }
  @keyframes pulso {
    0%   { transform: scale(.5); opacity: 1; }
    100% { transform: scale(2.2); opacity: 0; }
  }
  .punto-estadio .ficha {
    position: absolute;
    bottom: 44px; left: 50%;
    width: 250px;
    transform: translate(-50%, 8px);
    padding: 14px 16px 14px;
    text-align: left;
    color: var(--texto);
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    background: rgba(11, 16, 32, .82);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    border-radius: 12px;
    border-top: 3px solid var(--acento);
    box-shadow: 0 12px 32px rgba(0, 0, 0, .45);
    opacity: 0;
    visibility: hidden;
    transition: opacity .25s, transform .25s, visibility .25s;
    pointer-events: none;
  }
  .punto-estadio .ficha::after {
    content: "";
    position: absolute; left: 50%; bottom: -8px;
    width: 14px; height: 14px;
    background: rgba(11, 16, 32, .82);
    transform: translateX(-50%) rotate(45deg);
  }
  .punto-estadio .ficha small {
    display: block;
    font-size: .7rem; letter-spacing: .12em; text-transform: uppercase;
    color: var(--acento);
  }
  .punto-estadio .ficha strong {
    display: block;
    font-size: 1.25rem; line-height: 1.2;
    margin: 2px 0 4px;
  }
  .punto-estadio .ficha span {
    display: block;
    font-size: .85rem; color: var(--suave);
  }
  .punto-estadio:hover .ficha,
  .punto-estadio.abierto .ficha {
    opacity: 1; visibility: visible;
    transform: translate(-50%, 0);
  }
  /* variante: ficha debajo del punto (para los cerros, cerca del borde superior) */
  .punto-estadio .ficha.abajo {
    bottom: auto; top: 44px;
    transform: translate(-50%, -8px);
    border-top: 0;
    border-bottom: 3px solid var(--acento2);
  }
  .punto-estadio .ficha.abajo::after { bottom: auto; top: -8px; }
  .punto-estadio:hover .ficha.abajo,
  .punto-estadio.abierto .ficha.abajo { transform: translate(-50%, 0); }
  .punto-estadio .ficha .accion { color: var(--acento2); margin-top: 6px; font-size: .8rem; }

  /* foto del estadio sobre el visor */
  .foto-overlay {
    position: absolute; inset: 0; z-index: 20;
    background: #000;
    opacity: 0; visibility: hidden;
    transition: opacity .5s, visibility .5s;
  }
  .foto-overlay.visible { opacity: 1; visibility: visible; }
  .foto-overlay img { display: block; width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
  .foto-overlay .cerrar {
    position: absolute; top: 14px; right: 14px;
    width: 42px; height: 42px;
    border: 0; border-radius: 50%;
    background: rgba(11, 16, 32, .75); color: #fff;
    font-size: 1.2rem; cursor: pointer;
  }
  .foto-overlay .pie {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 3rem 1.5rem 1.2rem;
    text-align: left;
    background: linear-gradient(transparent, rgba(0, 0, 0, .75));
    color: #fff; font-size: 1.3rem; font-weight: bold;
  }
  .foto-overlay .pie small { display: block; font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--acento); }
  @media (prefers-reduced-motion: reduce) { h1, .punto-estadio .pulso { animation: none; } }
</style>
</head>
<body>
<canvas id="fondo"></canvas>
<div id="cursor"></div>

<main class="arriba">
  <h1>Todo en una sola página</h1>
  <p>Fondo animado, un video de YouTube y una imagen 360 que puedes girar con el mouse o con el dedo.</p>

  <h2>Video</h2>
  <div class="marco hover-grande">
    <iframe src="https://www.youtube.com/embed/AS7GjauM0os?si=jUb5Ql94Nt_lyrw9" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>

  <h2>Imagen 360</h2>
  <p>Arrastra para girar la vista.</p>
</main>

<div class="pano-full hover-grande">
  <div id="panorama"></div>
  <div class="foto-overlay" id="foto-estadio" aria-hidden="true">
    <img src="estadio.jpg" alt="Vista aérea del Estadio Nacional">
    <button class="cerrar" id="cerrar-foto" aria-label="Cerrar foto">✕</button>
    <div class="pie"><small>Fotografía</small>Estadio Nacional</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script>
  // ================== IMAGEN 360 ==================
  // Para usar tu propia foto: sube "foto360.jpg" al repositorio
  // y cambia null por 'foto360.jpg' en la línea de abajo.
  const MI_IMAGEN_360 = 'foto360.jpg';

  // Imagen de ejemplo dibujada con código (formato equirectangular 2:1)
  function crearPanoramaDeEjemplo() {
    const W = 2048, H = 1024, hor = H * 0.55;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');

    // cielo
    let s = g.createLinearGradient(0, 0, 0, hor);
    s.addColorStop(0, '#050816');
    s.addColorStop(.6, '#3b2a6b');
    s.addColorStop(1, '#f4a07a');
    g.fillStyle = s; g.fillRect(0, 0, W, hor);

    // estrellas
    for (let i = 0; i < 450; i++) {
      g.fillStyle = 'rgba(255,255,255,' + (Math.random() * .8 + .2) + ')';
      g.fillRect(Math.random() * W, Math.random() * hor * .75, 2, 2);
    }

    // sol con brillo
    const sx = W * .62, sy = hor - 50;
    const sol = g.createRadialGradient(sx, sy, 10, sx, sy, 190);
    sol.addColorStop(0, 'rgba(255,235,180,1)');
    sol.addColorStop(.3, 'rgba(255,170,120,.6)');
    sol.addColorStop(1, 'rgba(255,170,120,0)');
    g.fillStyle = sol; g.fillRect(sx - 200, sy - 200, 400, 400);

    // montañas (usan senos con frecuencia entera para que los bordes encajen)
    function montanas(base, a, color) {
      g.fillStyle = color;
      g.beginPath(); g.moveTo(0, hor);
      for (let x = 0; x <= W; x += 4) {
        const t = x / W * Math.PI * 2;
        const y = base - a * (Math.sin(t * 3 + 1) * .5 + Math.sin(t * 7 + 2) * .3 + Math.sin(t * 17) * .2);
        g.lineTo(x, y);
      }
      g.lineTo(W, hor); g.closePath(); g.fill();
    }
    montanas(hor - 40, 70, '#4a3470');
    montanas(hor - 15, 50, '#1f1b3d');

    // suelo
    s = g.createLinearGradient(0, hor, 0, H);
    s.addColorStop(0, '#12263a');
    s.addColorStop(1, '#06121c');
    g.fillStyle = s; g.fillRect(0, hor, W, H - hor);
    g.strokeStyle = 'rgba(94,234,212,.25)'; g.lineWidth = 2;
    for (let x = 0; x <= W; x += W / 32) { g.beginPath(); g.moveTo(x, hor); g.lineTo(x, H); g.stroke(); }
    for (let i = 1; i < 8; i++) {
      const y = hor + Math.pow(i / 8, 2) * (H - hor);
      g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
    }

    // letreros para notar el giro (NORTE se dibuja en ambos bordes y se une)
    g.font = 'bold 120px "Trebuchet MS", sans-serif';
    g.textAlign = 'center'; g.fillStyle = '#5eead4';
    [['NORTE', 0], ['NORTE', W], ['ESTE', W * .25], ['SUR', W * .5], ['OESTE', W * .75]]
      .forEach(([t, x]) => g.fillText(t, x, hor - 110));

    return c.toDataURL('image/jpeg', .9);
  }

  // Crea un punto interactivo con ficha (edita los textos en cada punto)
  function crearPunto(o) {
    return function (div) {
      div.classList.add('abierto'); // empieza abierto; un clic lo cierra o abre
      div.innerHTML =
        '<span class="pulso"></span><span class="centro"></span>' +
        '<div class="ficha' + (o.abajo ? ' abajo' : '') + '">' +
          '<small>' + o.etiqueta + '</small>' +
          '<strong>' + o.titulo + '</strong>' +
          (o.detalle ? '<span>' + o.detalle + '</span>' : '') +
          (o.accion ? '<span class="accion">' + o.accion + '</span>' : '') +
        '</div>';
      div.addEventListener('click', o.alClic || (() => div.classList.toggle('abierto')));
    };
  }

  const visor = pannellum.viewer('panorama', {
    type: 'equirectangular',
    panorama: MI_IMAGEN_360 || crearPanoramaDeEjemplo(),
    autoLoad: true,
    autoRotate: -2,
    showControls: true,
    hfov: 100,
    minHfov: 20,
    pitch: -15,
    yaw: 0,
    hotSpots: [
      {
        pitch: -17, yaw: -0.7, type: 'custom', cssClass: 'punto-estadio',
        createTooltipFunc: crearPunto({
          etiqueta: 'Punto de interés',
          titulo: 'Estadio Nacional',
          detalle: 'Julio Martínez Prádanos · Ñuñoa, Santiago',
          accion: 'Clic para ver la fotografía',
          alClic: abrirFoto
        })
      },
      {
        pitch: 2, yaw: -119.5, type: 'custom', cssClass: 'punto-estadio',
        createTooltipFunc: crearPunto({ etiqueta: 'Cerro', titulo: 'Cerro San Cristóbal', abajo: true })
      },
      {
        pitch: 0.8, yaw: -146.5, type: 'custom', cssClass: 'punto-estadio',
        createTooltipFunc: crearPunto({ etiqueta: 'Cerro', titulo: 'Cerro Renca', abajo: true })
      }
    ]
  });

  // Zoom al estadio y luego aparece la fotografía
  const capaFoto = document.getElementById('foto-estadio');
  let temporizadorFoto = null;
  function abrirFoto() {
    visor.stopAutoRotate();
    visor.lookAt(-17, -0.7, 28, 1100);
    temporizadorFoto = setTimeout(() => capaFoto.classList.add('visible'), 1000);
  }
  function cerrarFoto() {
    clearTimeout(temporizadorFoto);
    capaFoto.classList.remove('visible');
    visor.lookAt(-15, 0, 100, 1000);
  }
  document.getElementById('cerrar-foto').addEventListener('click', cerrarFoto);
  capaFoto.querySelector('img').addEventListener('click', cerrarFoto);
  window.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarFoto(); });

  // ================== FONDO ANIMADO ==================
  const canvas = document.getElementById('fondo');
  const ctx = canvas.getContext('2d');
  const mouse = { x: -9999, y: -9999 };
  let particulas = [];
  const reducir = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function ajustar() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const cantidad = Math.min(110, Math.floor(canvas.width * canvas.height / 14000));
    particulas = Array.from({ length: cantidad }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - .5) * .5,
      vy: (Math.random() - .5) * .5,
      r: Math.random() * 2 + 1
    }));
  }

  function dibujar() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particulas) {
      const dx = p.x - mouse.x, dy = p.y - mouse.y;
      const d = Math.hypot(dx, dy);
      if (d < 120 && d > 0) { p.x += dx / d * 1.6; p.y += dy / d * 1.6; }
      if (!reducir) { p.x += p.vx; p.y += p.vy; }
      if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
      if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(94, 234, 212, .8)';
      ctx.fill();
    }
    for (let i = 0; i < particulas.length; i++) {
      for (let j = i + 1; j < particulas.length; j++) {
        const a = particulas[i], b = particulas[j];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < 120) {
          ctx.strokeStyle = 'rgba(244, 114, 182,' + (1 - d / 120) * .35 + ')';
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
    }
    requestAnimationFrame(dibujar);
  }

  // ================== CURSOR ==================
  const cursor = document.getElementById('cursor');
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    cursor.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)';
  });
  window.addEventListener('mouseleave', () => { mouse.x = mouse.y = -9999; });
  document.querySelectorAll('.hover-grande').forEach(el => {
    el.addEventListener('mouseenter', () => cursor.classList.add('grande'));
    el.addEventListener('mouseleave', () => cursor.classList.remove('grande'));
  });

  window.addEventListener('resize', ajustar);
  ajustar();
  dibujar();
</script>
</body>
</html>
